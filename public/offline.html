<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#2c58c4" />
<title>Offline · MaintenanceOS</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a;
         min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #475569; font-size: 15px; line-height: 1.5; margin: 0 0 20px; max-width: 320px; }
  button { background: #2c58c4; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="" />
    <h1>No connection</h1>
    <p>MaintenanceOS needs a signal to load. Check Wi-Fi or cell service and try again. Nothing you saved before losing signal was lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
